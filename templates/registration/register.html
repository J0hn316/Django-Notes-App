{% load static %}

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Register | Django Notes App</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
  </head>

  <body>
    <main>
      <h1>Create Account</h1>

      <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
      </form>

      <p>
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
      </p>
    </main>
  </body>

</html>
