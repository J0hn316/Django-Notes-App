{% load static %}

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Login | Django Notes App</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
  </head>

  <body>
    <main>
      <h1>Login</h1>

      {% if form.errors %}
      <p class="message error">
        Your username and password did not match. Please try again.
      </p>
      {% endif %}

      {% if next %}
      <p class="message info">
        Please log in to continue.
      </p>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
      </form>

      <p>
        Need an account?
        <a href="{% url 'register' %}">Register here</a>
      </p>
    </main>
  </body>

</html>
