{% load static %}

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Notes App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
  </head>

  <body>
    <header>
      <h1>Django Notes App</h1>

      <nav>
        <a href="{% url 'notes_home' %}">Home</a>
        |
        <a href="{% url 'note_create' %}">Create Note</a>
      </nav>
    </header>

    <main>
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <p class="message {{ message.tags }}">
          {{ message }}
        </p>
        {% endfor %}
      </div>
      {% endif %}

      {% block content %}
      {% endblock %}
    </main>
  </body>

</html>
