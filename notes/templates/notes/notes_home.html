<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Django Notes App</title>
  </head>

  <body>
    <h1>My Notes</h1>

    <a href="{% url 'note_create' %}">Create New Note</a>

    {% if notes %}
    <ul>
      {% for note in notes %}
      <li>
        <h2>{{ note.title }}</h2>
        <p>{{ note.content }}</p>
        <small>Created: {{ note.created_at }}</small>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No notes yet.</p>
    {% endif %}
  </body>

</html>
