<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Delete Note</title>
  </head>

  <body>
    <h1>Delete Note</h1>

    <p>Are you sure you want to delete this note?</p>

    <h2>{{ note.title }}</h2>
    <p>{{ note.content }}</p>

    <form method="post">
      {% csrf_token %}

      <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'note_detail' note.pk %}">Cancel</a>
  </body>

</html>
