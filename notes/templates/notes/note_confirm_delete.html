{% extends "notes/base.html" %}

{% block title %}Delete Note{% endblock %}

{% block content %}
<article class="note-card">
  <h2>Delete Note</h2>

  <p>Are you sure you want to delete this note?</p>

  <h3>{{ note.title }}</h3>
  <p>{{ note.content }}</p>

  <form method="post">
    {% csrf_token %}

    <button class="delete-button" type="submit">Yes, Delete</button>
  </form>

  <div class="actions">
    <a href="{% url 'note_detail' note.pk %}">Cancel</a>
  </div>
</article>
{% endblock %}
