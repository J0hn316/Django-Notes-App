{% extends "notes/base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
<article class="note-card">
  <h2>{{ note.title }}</h2>

  <p>{{ note.content }}</p>

  <p>
    <small class="muted">Created: {{ note.created_at }}</small>
  </p>

  <p>
    <small class="muted">Updated: {{ note.updated_at }}</small>
  </p>

  <div class="actions">
    <a href="{% url 'note_update' note.pk %}">Edit Note</a>
    <a href="{% url 'note_delete' note.pk %}">Delete Note</a>
    <a href="{% url 'notes_home' %}">Back to Notes</a>
  </div>
</article>
{% endblock %}
